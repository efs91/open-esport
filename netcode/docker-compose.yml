# Serveur en ligne : matchmaking + serveurs de partie, tout dans Docker.
#
#   cp .env.example .env     (puis régler PUBLIC_HOST, OE_ADMIN_TOKEN, MAPS_DIR)
#   docker compose up -d --build     (construit le matchmaking ; il reconstruit lui-même l'image du serveur de partie à chaque démarrage)
#
# Les serveurs de partie sont lancés par le matchmaking avec « docker run » (nom explicite open-esport-<mode>-<port>) :
# il faut donc la socket Docker, et le dossier des cartes doit avoir LE MÊME chemin dans le conteneur et sur la machine
# (c'est le démon de la machine qui monte les cartes dans chaque serveur de partie).
services:
  # comptes des joueurs : inscription, connexion, personnages, statistiques, classements (base SQLite dans un volume).
  # Les mots de passe transitent par ce service : en ligne, mets-le derrière du HTTPS (voir README : proxy inverse) avant d'inviter des joueurs.
  accounts:
    image: open-esport-accounts:latest
    build:
      context: .
      dockerfile: Dockerfile.accounts
    container_name: open-esport-accounts
    restart: unless-stopped
    environment:
      OE_ACCOUNTS_KEY: ${ACCOUNTS_KEY:?ACCOUNTS_KEY - clé secrète partagée avec le matchmaking (openssl rand -hex 24)}
    ports:
      - "${ACCOUNTS_PORT:-27090}:27090/tcp"
    volumes:
      - accounts-data:/data

  matchmaker:
    image: open-esport-matchmaker:latest
    build:
      context: .
      dockerfile: Dockerfile.matchmaker
    container_name: open-esport-matchmaker
    restart: unless-stopped
    command:
      - --public-host
      - ${PUBLIC_HOST:?PUBLIC_HOST - adresse ou IP publique du serveur}
      - --network
      - open-esport                     # les serveurs de partie rejoignent ce réseau et sont sondés par leur nom de conteneur (pas de traduction d'adresses de Docker)
      - --port
      - "27000"
      - --ports
      - ${GAME_PORTS:-27100-27199}
      - --players
      - "${PLAYERS:-30}"
      - --lobby-countdown
      - "${LOBBY_COUNTDOWN:-5}"              # secondes d'attente dans la salle avant le départ de la partie
      - --min-players
      - "${MIN_PLAYERS:-1}"
      - --world
      - ${MAPS_DIR:-/opt/open-esport/maps}/frontiere01.world
      - --image
      - open-esport-server:latest
      - --balance
      - ${CONFIG_DIR:-/opt/open-esport/config}/balance.json   # tes réglages (panneau Godot) ; sinon valeurs par défaut du code
      - --netcode-dir                   # à chaque démarrage : docker build (cache Docker = instantané si le code n'a pas changé)
      - /netcode
      - --cpus
      - "${GAME_CPUS:-2}"
      - --memory
      - ${GAME_MEMORY:-1g}
      - --admin-port
      - "27080"
      - --admin-bind
      - 0.0.0.0                         # dans le conteneur ; côté machine, le port n'est publié que sur 127.0.0.1 (voir ports)
    environment:
      OE_ADMIN_TOKEN: ${OE_ADMIN_TOKEN:-}
      # comptes : les serveurs de partie (lancés par le matchmaking) l'exigent et lui rapportent les parties
      OE_ACCOUNTS_URL: http://accounts:27090
      OE_ACCOUNTS_KEY: ${ACCOUNTS_KEY:?ACCOUNTS_KEY - clé secrète partagée avec le service de comptes}
    ports:
      - "27000:27000/udp"               # demandes des joueurs
      - "127.0.0.1:27080:27080/tcp"     # tableau de bord : tunnel SSH ou proxy HTTPS pour y accéder
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/netcode:ro                   # le code du serveur de partie (Dockerfile + sources) : le matchmaker reconstruit l'image avec
      - ${MAPS_DIR:-/opt/open-esport/maps}:${MAPS_DIR:-/opt/open-esport/maps}:ro
      - ${CONFIG_DIR:-/opt/open-esport/config}:${CONFIG_DIR:-/opt/open-esport/config}:ro

networks:
  default:
    name: open-esport

volumes:
  # NE PAS supprimer avec « docker compose down -v » : c'est la base des comptes
  accounts-data:
